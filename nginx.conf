server {
  listen 80;
  server_name localhost;
  root /usr/share/nginx/html;
  index index.html;

  # Nada de dotfiles (.git, .env) nem do próprio config servido como estático
  location ~ /\.(?!well-known) {
    deny all;
  }

  location = /nginx.conf {
    deny all;
  }

  # HTML sempre revalida — evita página antiga apontando CSS antigo
  location ~* \.html$ {
    add_header Cache-Control "no-cache, must-revalidate";
  }

  location = / {
    add_header Cache-Control "no-cache, must-revalidate";
  }

  # Assets versionados via ?v= no HTML
  location /src/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # URL inexistente responde 404 de verdade: o fallback para o index gerava soft 404 para os buscadores
  error_page 404 /404.html;

  location / {
    try_files $uri $uri/ =404;
  }
}
